<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat with Seller | YouVersion 2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../index.css">
  <style>
    body { background-color: #F8FAFC; display: flex; flex-direction: column; min-height: 100vh; margin: 0; }
    .app-header { position: sticky; top: 0; z-index: 100; background: #fff; box-shadow: var(--shadow-sm); }
    .chat-wrapper { flex: 1; padding: 2rem; max-width: 1200px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; height: calc(100vh - 80px); }
    
    .messages-container { display: flex; background: #FFFFFF; border: 1px solid var(--border-color); border-radius: var(--radius-medium); box-shadow: var(--shadow-light); flex: 1; overflow: hidden; }
    .messages-sidebar { width: 300px; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
    .messages-search { padding: 1rem; border-bottom: 1px solid var(--border-color); }
    .message-list { flex: 1; overflow-y: auto; }
    .message-item { padding: 1rem; border-bottom: 1px solid var(--border-color); cursor: pointer; transition: var(--transition-smooth); display: flex; gap: 1rem; }
    .message-item:hover, .message-item.active { background: var(--bg-grad-end); }
    .message-item.unread h6 { font-weight: 700; color: var(--primary-color); }
    .message-item .avatar { width: 40px; height: 40px; background: #E5E7EB; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; color: var(--text-secondary); flex-shrink: 0; }
    
    .messages-view { flex: 1; display: flex; flex-direction: column; }
    .message-header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .message-history { flex: 1; padding: 1.5rem; overflow-y: auto; background: var(--bg-grad-end); display: flex; flex-direction: column; gap: 1rem; }
    .message-bubble { max-width: 70%; padding: 1rem; border-radius: var(--radius-medium); font-size: 0.9rem; }
    .bubble-received { background: #FFFFFF; border: 1px solid var(--border-color); align-self: flex-start; border-top-left-radius: 0; }
    .bubble-sent { background: var(--primary-color); color: #FFFFFF; align-self: flex-end; border-top-right-radius: 0; }
    .message-input { padding: 1rem; border-top: 1px solid var(--border-color); display: flex; gap: 1rem; align-items: center; background: #FFFFFF; }
    .message-input input { flex: 1; padding: 0.75rem 1rem; border: 1px solid var(--border-color); border-radius: var(--radius-large); outline: none; }
  </style>
  <!-- Brand skin (loaded last so it wins over page-level legacy styles) -->
  <link rel="stylesheet" href="../skin.css">
</head>
<body>

  <!-- STICKY HEADER -->
  <header class="app-header">
    <div class="header-container">
      <a href="index.html" class="logo-wrapper">
        <span class="logo-text">YouVersion <span class="accent-number">2</span></span>
      </a>
      <nav class="main-nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="index.html#shop-section">Buy Editions</a></li>
          <li><a href="wishlist.html">My Wishlist</a></li>
          <li><a href="chat.html" class="active-nav">Messages</a></li>
          <li><a href="settings.html">Settings</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <a href="settings.html" class="action-btn profile-btn" title="Account Settings">
          <i data-lucide="user" class="avatar-img"></i>
        </a>
      </div>
    </div>
  </header>

  <main class="chat-wrapper">
    <div style="margin-bottom: 1rem; display: flex; align-items: center; gap: 1rem;">
      <a href="index.html" class="btn btn-outline btn-small icon-only-btn" style="border-radius: 50%;"><i data-lucide="arrow-left"></i></a>
      <h1 style="font-size: 1.75rem; font-weight: 700; margin: 0;">Chat with Sellers</h1>
    </div>

    <div class="messages-container">
      <!-- Sidebar List -->
      <div class="messages-sidebar">
        <div class="messages-search">
          <input type="text" placeholder="Search sellers..." style="width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px; font-size: 0.85rem; outline: none;">
        </div>
        <div class="message-list" id="conversation-list">
          <!-- Dynamic conversations -->
        </div>
      </div>

      <!-- Chat View -->
      <div class="messages-view">
        <div class="message-header">
          <div style="display: flex; align-items: center; gap: 1rem;">
            <div class="avatar" id="current-chat-avatar" style="width: 40px; height: 40px; background: #E5E7EB; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; color: var(--text-secondary);">?</div>
            <div>
              <h6 style="margin: 0; font-size: 1rem;" id="current-chat-name">Select a seller</h6>
              <span style="font-size: 0.8rem; color: #10B981;" id="current-chat-status"></span>
            </div>
          </div>
        </div>
        <div class="message-history" id="message-history">
          <!-- Dynamic messages -->
        </div>
        <div class="message-input">
          <button class="btn btn-outline icon-only-btn" style="border-color: transparent;"><i data-lucide="paperclip"></i></button>
          <input type="text" id="message-text" placeholder="Type a message to the seller..." disabled>
          <button class="btn btn-primary" id="send-btn" disabled><i data-lucide="send"></i></button>
        </div>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../auth.js"></script>
  <script>
    lucide.createIcons();

    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
    const initialsOf = (f, l) => `${(f || '?')[0] || ''}${(l || '')[0] || ''}`.toUpperCase();

    let currentUser = null;
    let activeSellerId = Number(new URLSearchParams(window.location.search).get('seller_id')) || null;
    let lastSignature = '';
    let selected = false;

    async function getJSON(url, options) {
      const res = await fetch(url, options);
      const data = await res.json().catch(() => ({}));
      if (res.status === 401) {
        localStorage.removeItem('user');
        window.location.href = '../login.html';
        throw new Error('Please log in again.');
      }
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    async function loadConversations() {
      try {
        const conversations = await getJSON(`/api/chat/conversations/${currentUser.id}/buyer`);

        // A seller opened from a book page may not have a conversation yet
        if (activeSellerId && !conversations.find(c => c.id === activeSellerId)) {
          try {
            const seller = await getJSON(`/api/sellers/${activeSellerId}`);
            conversations.unshift({ ...seller, last_message: 'Start a conversation...' });
          } catch (e) {
            activeSellerId = null;
          }
        }

        const listEl = document.getElementById('conversation-list');
        listEl.innerHTML = conversations.length ? '' : '<p style="padding: 1rem; color: var(--text-secondary); font-size: 0.9rem;">No conversations yet. Open a book and tap “Chat” to message the seller.</p>';

        conversations.forEach(conv => {
          const item = document.createElement('div');
          item.className = `message-item ${conv.id === activeSellerId ? 'active' : ''}`;
          item.dataset.id = conv.id;
          item.onclick = () => selectChat(conv.id, `${conv.fname} ${conv.lname}`, initialsOf(conv.fname, conv.lname));
          item.innerHTML = `
            <div class="avatar">${esc(initialsOf(conv.fname, conv.lname))}</div>
            <div style="flex: 1; overflow: hidden;">
              <h6 style="margin: 0; font-size: 0.9rem;">${esc(conv.fname)} ${esc(conv.lname)}</h6>
              <p style="margin: 0; font-size: 0.8rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${esc(conv.last_message || 'No messages yet')}</p>
            </div>`;
          listEl.appendChild(item);
        });

        if (activeSellerId && !selected) {
          const activeConv = conversations.find(c => c.id === activeSellerId);
          if (activeConv) selectChat(activeSellerId, `${activeConv.fname} ${activeConv.lname}`, initialsOf(activeConv.fname, activeConv.lname));
        }
      } catch (e) {
        console.error('Error loading conversations:', e);
      }
    }

    function selectChat(sellerId, name, initials) {
      activeSellerId = sellerId;
      selected = true;
      lastSignature = '';
      document.getElementById('current-chat-name').innerText = name;
      document.getElementById('current-chat-avatar').innerText = initials;
      document.getElementById('current-chat-status').innerText = 'Seller';
      document.getElementById('message-text').disabled = false;
      document.getElementById('send-btn').disabled = false;
      document.querySelectorAll('.message-item').forEach(el => el.classList.toggle('active', Number(el.dataset.id) === sellerId));
      loadMessages();
    }

    async function loadMessages() {
      if (!activeSellerId) return;
      try {
        const messages = await getJSON(`/api/chat/${currentUser.id}/${activeSellerId}`);
        const signature = messages.map(m => m.id).join(',');
        if (signature === lastSignature) return; // nothing new; keep scroll position
        lastSignature = signature;

        const historyEl = document.getElementById('message-history');
        historyEl.innerHTML = '';
        messages.forEach(msg => {
          const bubble = document.createElement('div');
          bubble.className = `message-bubble ${msg.sender === 'buyer' ? 'bubble-sent' : 'bubble-received'}`;
          bubble.innerHTML = `<p style="margin: 0;"></p><span style="font-size: 0.7rem; opacity: 0.7; margin-top: 0.5rem; display: block;">${new Date(msg.created_at).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</span>`;
          bubble.querySelector('p').textContent = msg.message;
          historyEl.appendChild(bubble);
        });
        historyEl.scrollTop = historyEl.scrollHeight;
      } catch (e) {
        console.error('Error loading messages:', e);
      }
    }

    document.getElementById('send-btn').addEventListener('click', sendMessage);
    document.getElementById('message-text').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // Search filters the conversation list
    document.querySelector('.messages-search input')?.addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      document.querySelectorAll('#conversation-list .message-item').forEach(el => {
        el.style.display = !q || el.textContent.toLowerCase().includes(q) ? '' : 'none';
      });
    });

    async function sendMessage() {
      const input = document.getElementById('message-text');
      const text = input.value.trim();
      if (!text || !activeSellerId) return;
      try {
        await getJSON('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ seller_id: activeSellerId, message: text })
        });
        input.value = '';
        loadMessages();
        loadConversations();
      } catch (e) {
        alert(e.message);
      }
    }

    window.YVSession.then((user) => {
      if (!user) return; // auth.js redirects to the login page
      currentUser = user;
      loadConversations();
      // Poll for new messages every 5 seconds
      setInterval(loadMessages, 5000);
    });
  </script>
  <script src="../motion.js"></script>
</body>
</html>
