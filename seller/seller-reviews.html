<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reviews | Seller Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../index.css">
  <style>
    :root { --sidebar-width: 260px; --header-height: 70px; }
    body { background-color: #F8FAFC; display: flex; min-height: 100vh; }
    .dashboard-sidebar { width: var(--sidebar-width); background-color: #FFFFFF; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; }
    .sidebar-header { height: var(--header-height); display: flex; align-items: center; padding: 0 1.5rem; border-bottom: 1px solid var(--border-color); }
    .sidebar-header .logo-wrapper { font-size: 1.25rem; }
    .sidebar-nav { padding: 1.5rem 1rem; flex: 1; }
    .nav-item { display: flex; align-items: center; gap: 1rem; padding: 0.85rem 1rem; color: var(--text-secondary); border-radius: var(--radius-small); font-weight: 500; margin-bottom: 0.5rem; transition: var(--transition-smooth); }
    .nav-item:hover, .nav-item.active { background-color: var(--accent-blue); color: var(--primary-color); }
    .sidebar-footer { padding: 1.5rem 1rem; border-top: 1px solid var(--border-color); }
    .dashboard-main { flex: 1; margin-left: var(--sidebar-width); display: flex; flex-direction: column; }
    .dashboard-header { height: var(--header-height); background-color: #FFFFFF; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; position: sticky; top: 0; z-index: 50; }
    .header-search { display: flex; align-items: center; background: var(--bg-grad-end); padding: 0.5rem 1rem; border-radius: var(--radius-large); width: 300px; }
    .header-search input { margin-left: 0.5rem; width: 100%; font-size: 0.9rem; }
    .header-actions { display: flex; align-items: center; gap: 1.5rem; }
    .user-profile { display: flex; align-items: center; gap: 0.75rem; }
    .user-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .user-info h6 { font-size: 0.9rem; font-weight: 600; color: var(--text-primary); }
    .user-info p { font-size: 0.75rem; color: var(--text-secondary); }
    .dashboard-content { padding: 2rem; max-width: 1000px; margin: 0 auto; width: 100%; }
    
    .review-summary-card { background: linear-gradient(135deg, var(--primary-color), var(--primary-light)); color: white; border-radius: var(--radius-medium); padding: 2rem; display: flex; align-items: center; gap: 3rem; margin-bottom: 2rem; box-shadow: var(--shadow-medium); }
    .review-score { text-align: center; }
    .review-score h2 { font-size: 3rem; font-weight: 800; line-height: 1; margin-bottom: 0.5rem; }
    .review-stars { color: var(--secondary-color); font-size: 1.25rem; margin-bottom: 0.5rem; display: flex; gap: 0.25rem; justify-content: center; }
    .review-bars { flex: 1; display: flex; flex-direction: column; gap: 0.5rem; }
    .bar-row { display: flex; align-items: center; gap: 1rem; font-size: 0.85rem; font-weight: 500; }
    .bar-track { flex: 1; height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--secondary-color); border-radius: 4px; }
    
    .review-item { background: #FFFFFF; border: 1px solid var(--border-color); border-radius: var(--radius-medium); padding: 1.5rem; margin-bottom: 1rem; box-shadow: var(--shadow-light); transition: var(--transition-smooth); }
    .review-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .review-customer { display: flex; align-items: center; gap: 1rem; }
    .review-customer-avatar { width: 40px; height: 40px; background: #E5E7EB; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; color: var(--text-secondary); }
    .review-customer-info h6 { font-size: 0.95rem; font-weight: 600; color: var(--text-primary); }
    .review-customer-info p { font-size: 0.8rem; color: var(--text-light); }
    .review-item-stars { color: #F59E0B; display: flex; gap: 0.25rem; }
    .review-item p { font-size: 0.95rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 1rem; }
    .review-reply { background: var(--bg-grad-end); border-left: 3px solid var(--primary-color); padding: 1rem; border-radius: 0 var(--radius-small) var(--radius-small) 0; font-size: 0.9rem; color: var(--text-secondary); }
  </style>
  <!-- Brand skin (loaded last so it wins over page-level legacy styles) -->
  <link rel="stylesheet" href="../skin.css">
</head>
<body>
  <aside class="dashboard-sidebar">
    <div class="sidebar-header">
      <a href="../index.html" class="logo-wrapper">
        
        <span class="logo-text">YouVersion <span class="accent-number">2</span></span>
      </a>
    </div>
    <div class="sidebar-nav">
      <a href="seller-dashboard.html" class="nav-item">
        <i data-lucide="layout-dashboard"></i><span>Dashboard</span>
      </a>
      <a href="seller-books.html" class="nav-item">
        <i data-lucide="book"></i><span>My Books</span>
      </a>
      <a href="seller-orders.html" class="nav-item">
        <i data-lucide="shopping-cart"></i><span>Orders</span>
      </a>
      <a href="seller-messages.html" class="nav-item">
        <i data-lucide="message-square"></i><span>Messages</span>
      </a>
      <a href="seller-notifications.html" class="nav-item">
        <i data-lucide="bell"></i><span>Notifications</span>
      </a>
    </div>
    <div class="sidebar-footer">
      <a href="seller-settings.html" class="nav-item">
        <i data-lucide="settings"></i><span>Settings</span>
      </a>
      <a href="../login.html" class="nav-item">
        <i data-lucide="log-out"></i><span>Logout</span>
      </a>
    </div>
  </aside>

  <main class="dashboard-main">
    <header class="dashboard-header">
      <div class="header-search">
        <i data-lucide="search" style="color: var(--text-light); width: 18px;"></i>
        <input type="text" placeholder="Search reviews...">
      </div>
      <div class="header-actions">
        <a href="seller-notifications.html" class="action-btn" title="Notifications">
          <i data-lucide="bell"></i><span class="badge" style="top: 0; right: 0;">3</span>
        </a>
        <div class="user-profile">
          <img src="../assets/2.jpg" alt="Ollie Baldemor" class="user-avatar">
          <div class="user-info">
            <h6>Ollie G. Baldemor</h6>
            <p>Author & Seller</p>
          </div>
          <i data-lucide="chevron-down" style="color: var(--text-secondary); width: 16px;"></i>
        </div>
      </div>
    </header>

    <div class="dashboard-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; gap: 1rem; flex-wrap: wrap;">
        <div>
          <h1 style="font-size: 1.75rem; font-weight: 700;">Customer Reviews</h1>
          <p style="color: var(--text-secondary); font-size: 0.9rem;">See what your readers are saying about your books.</p>
        </div>
        <select id="review-filter" class="filter-select" aria-label="Filter reviews">
          <option value="all">All Ratings</option>
          <option value="5">5 Stars Only</option>
          <option value="4up">4 Stars &amp; Up</option>
          <option value="low">3 Stars &amp; Below</option>
          <option value="unanswered">Needs Reply</option>
        </select>
      </div>

      <div class="review-summary-card">
        <div class="review-score">
          <h2 id="avg-score">—</h2>
          <div class="review-stars" id="avg-stars"></div>
          <p style="font-size: 0.85rem; opacity: 0.9;" id="review-total">Loading…</p>
        </div>
        <div class="review-bars" id="review-bars"></div>
      </div>

      <div class="reviews-list" id="reviews-list"></div>
    </div>
  </main>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../auth.js"></script>
  <script src="seller-common.js"></script>
  <script>
    lucide.createIcons();
    const { api, esc, timeAgo, initials, toast, ready } = YV;
    let data = null;
    const stars = (n, size = 16) => Array.from({ length: 5 }, (_, i) =>
      `<i data-lucide="star" style="width: ${size}px; ${i < n ? 'fill: currentColor;' : 'opacity: 0.3;'}"></i>`).join('');

    function renderList() {
      const filter = document.getElementById('review-filter').value;
      const rows = data.reviews.filter(r =>
        filter === 'all' || (filter === '5' && r.rating === 5) || (filter === '4up' && r.rating >= 4) ||
        (filter === 'low' && r.rating <= 3) || (filter === 'unanswered' && !r.reply));
      document.getElementById('reviews-list').innerHTML = rows.length ? rows.map(r => `
        <div class="review-item" data-searchable>
          <div class="review-item-header">
            <div class="review-customer">
              <div class="review-customer-avatar">${esc(initials(r.fname, r.lname))}</div>
              <div class="review-customer-info">
                <h6>${esc(r.fname)} ${esc(r.lname)}</h6>
                <p>Reviewed: ${esc(r.book_title)} • ${timeAgo(r.created_at)}</p>
              </div>
            </div>
            <div class="review-item-stars">${stars(r.rating)}</div>
          </div>
          <p>"${esc(r.comment)}"</p>
          ${r.reply ? `<div class="review-reply"><strong>Your reply:</strong> ${esc(r.reply)}</div>` : ''}
          <div class="review-actions">
            <a href="seller-reply-review.html?id=${r.id}" class="btn btn-outline btn-small"><i data-lucide="reply"></i> ${r.reply ? 'Edit Reply' : 'Reply'}</a>
            <span class="cell-sub"><i data-lucide="thumbs-up" style="width: 14px; vertical-align: -2px;"></i> ${r.helpful_count} found this helpful</span>
          </div>
        </div>`).join('') : '<p class="empty-note">No reviews match this filter yet.</p>';
      lucide.createIcons();
    }

    ready.then(async (me) => {
      if (!me) return;
      try {
        data = await api('/api/reviews');
      } catch (err) {
        document.getElementById('reviews-list').innerHTML = `<p class="empty-note">${esc(err.message)}</p>`;
        return;
      }
      document.getElementById('avg-score').textContent = data.total ? data.average.toFixed(1) : '—';
      document.getElementById('avg-stars').innerHTML = stars(Math.round(data.average), 20);
      document.getElementById('review-total').textContent = `Based on ${data.total} review${data.total === 1 ? '' : 's'}`;
      document.getElementById('review-bars').innerHTML = [5, 4, 3, 2, 1].map(n => {
        const count = data.breakdown[n] || 0;
        const pct = data.total ? Math.round(count / data.total * 100) : 0;
        return `<div class="bar-row"><span>${n} Star${n === 1 ? '' : 's'}</span><div class="bar-track"><div class="bar-fill" style="width: ${pct}%;"></div></div><span>${count}</span></div>`;
      }).join('');
      renderList();
      document.getElementById('review-filter').addEventListener('change', renderList);
    });
  </script>
  <script src="../motion.js"></script>
</body>
</html>
