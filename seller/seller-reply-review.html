<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reply to Review | Seller Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../index.css">
  <style>
    :root { --sidebar-width: 260px; --header-height: 70px; }
    body { background-color: #F8FAFC; display: flex; min-height: 100vh; }
    .dashboard-sidebar { width: var(--sidebar-width); background-color: #FFFFFF; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; }
    .sidebar-header { height: var(--header-height); display: flex; align-items: center; padding: 0 1.5rem; border-bottom: 1px solid var(--border-color); }
    .sidebar-header .logo-wrapper { font-size: 1.25rem; }
    .sidebar-nav { padding: 1.5rem 1rem; flex: 1; }
    .nav-item { display: flex; align-items: center; gap: 1rem; padding: 0.85rem 1rem; color: var(--text-secondary); border-radius: var(--radius-small); font-weight: 500; margin-bottom: 0.5rem; transition: var(--transition-smooth); }
    .nav-item:hover, .nav-item.active { background-color: var(--accent-blue); color: var(--primary-color); }
    .sidebar-footer { padding: 1.5rem 1rem; border-top: 1px solid var(--border-color); }
    .dashboard-main { flex: 1; margin-left: var(--sidebar-width); display: flex; flex-direction: column; }
    .dashboard-header { height: var(--header-height); background-color: #FFFFFF; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; position: sticky; top: 0; z-index: 50; }
    .header-search { display: flex; align-items: center; background: var(--bg-grad-end); padding: 0.5rem 1rem; border-radius: var(--radius-large); width: 300px; }
    .header-search input { margin-left: 0.5rem; width: 100%; font-size: 0.9rem; }
    .header-actions { display: flex; align-items: center; gap: 1.5rem; }
    .user-profile { display: flex; align-items: center; gap: 0.75rem; }
    .user-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .user-info h6 { font-size: 0.9rem; font-weight: 600; color: var(--text-primary); }
    .user-info p { font-size: 0.75rem; color: var(--text-secondary); }
    .dashboard-content { padding: 2rem; max-width: 900px; margin: 0 auto; width: 100%; }
    
    .dashboard-panel { background: #FFFFFF; border: 1px solid var(--border-color); border-radius: var(--radius-medium); box-shadow: var(--shadow-light); margin-bottom: 1.5rem; padding: 2rem; }
    
    .review-customer { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
    .review-customer img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }
    .review-customer-info h6 { font-size: 1.05rem; font-weight: 600; color: var(--text-primary); }
    .review-customer-info p { font-size: 0.8rem; color: var(--text-secondary); }
    .stars { color: #F59E0B; display: flex; gap: 0.25rem; }
    
    .review-body { font-size: 0.95rem; line-height: 1.6; color: var(--text-secondary); padding: 1rem 0; border-bottom: 1px solid var(--border-color); margin-bottom: 1.5rem; }
    
    .reply-textarea { width: 100%; min-height: 150px; padding: 1rem; border: 1px solid var(--border-color); border-radius: var(--radius-small); font-family: inherit; font-size: 0.95rem; resize: vertical; outline: none; transition: var(--transition-smooth); }
    .reply-textarea:focus { border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(21,101,192,0.1); }
  </style>
  <!-- Brand skin (loaded last so it wins over page-level legacy styles) -->
  <link rel="stylesheet" href="../skin.css">
</head>
<body>
  <aside class="dashboard-sidebar">
    <div class="sidebar-header">
      <a href="../index.html" class="logo-wrapper">
        
        <span class="logo-text">YouVersion <span class="accent-number">2</span></span>
      </a>
    </div>
    <div class="sidebar-nav">
      <a href="seller-dashboard.html" class="nav-item">
        <i data-lucide="layout-dashboard"></i><span>Dashboard</span>
      </a>
      <a href="seller-books.html" class="nav-item">
        <i data-lucide="book"></i><span>My Books</span>
      </a>
      <a href="seller-orders.html" class="nav-item">
        <i data-lucide="shopping-cart"></i><span>Orders</span>
      </a>
      <a href="seller-messages.html" class="nav-item">
        <i data-lucide="message-square"></i><span>Messages</span>
      </a>
      <a href="seller-notifications.html" class="nav-item">
        <i data-lucide="bell"></i><span>Notifications</span>
      </a>
    </div>
    <div class="sidebar-footer">
      <a href="seller-settings.html" class="nav-item">
        <i data-lucide="settings"></i><span>Settings</span>
      </a>
      <a href="../login.html" class="nav-item">
        <i data-lucide="log-out"></i><span>Logout</span>
      </a>
    </div>
  </aside>

  <main class="dashboard-main">
    <header class="dashboard-header">
      <div class="header-search">
        <i data-lucide="search" style="color: var(--text-light); width: 18px;"></i>
        <input type="text" placeholder="Search...">
      </div>
      <div class="header-actions">
        <a href="seller-notifications.html" class="action-btn" title="Notifications">
          <i data-lucide="bell"></i><span class="badge" style="top: 0; right: 0;">3</span>
        </a>
        <div class="user-profile">
          <img src="../assets/2.jpg" alt="Ollie Baldemor" class="user-avatar">
          <div class="user-info">
            <h6>Ollie G. Baldemor</h6>
            <p>Author & Seller</p>
          </div>
          <i data-lucide="chevron-down" style="color: var(--text-secondary); width: 16px;"></i>
        </div>
      </div>
    </header>

    <div class="dashboard-content">
      <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem;">
        <a href="seller-reviews.html" class="btn btn-outline btn-small icon-only-btn" style="border-radius: 50%;" aria-label="Back to reviews"><i data-lucide="arrow-left"></i></a>
        <div>
          <h1 style="font-size: 1.75rem; font-weight: 700;">Reply to Review</h1>
          <p style="color: var(--text-secondary); font-size: 0.9rem;">Respond publicly to your customer's feedback.</p>
        </div>
      </div>

      <div class="dashboard-panel" style="max-width: 800px;" id="reply-root">
        <div class="panel-body"><p class="empty-note">Loading review…</p></div>
      </div>
    </div>
  </main>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../auth.js"></script>
  <script src="seller-common.js"></script>
  <script>
    lucide.createIcons();
    const { api, esc, fmtDate, initials, toast, param, ready } = YV;
    const reviewId = param('id');

    async function load() {
      const root = document.getElementById('reply-root');
      let r;
      try {
        r = await api(`/api/reviews/${reviewId}`);
      } catch (err) {
        root.innerHTML = `<div class="panel-body"><p class="empty-note">${esc(err.message)} <a href="seller-reviews.html">Back to reviews</a></p></div>`;
        return;
      }
      root.innerHTML = `
        <div class="panel-body">
          <div class="review-customer" style="justify-content: space-between; margin-bottom: 1.25rem; flex-wrap: wrap;">
            <div style="display: flex; align-items: center; gap: 1rem;">
              <div class="review-customer-avatar">${esc(initials(r.fname, r.lname))}</div>
              <div class="review-customer-info">
                <h6>${esc(r.fname)} ${esc(r.lname)}</h6>
                <p>Reviewed ${esc(r.book_title)} • ${fmtDate(r.created_at)}</p>
              </div>
            </div>
            <div class="stars" style="display: flex; color: #F59E0B;">${Array.from({ length: 5 }, (_, i) => `<i data-lucide="star" style="${i < r.rating ? 'fill: currentColor;' : 'opacity: 0.3;'}"></i>`).join('')}</div>
          </div>
          <div class="review-body" style="font-size: 1rem; line-height: 1.6; color: var(--text-secondary); padding-bottom: 1.5rem; border-bottom: 1px solid var(--border-color);">"${esc(r.comment)}"</div>

          <form id="reply-form" style="margin-top: 1.5rem;">
            <label for="reply-text" style="display: flex; align-items: center; gap: 0.5rem; font-weight: 600; margin-bottom: 0.75rem;"><i data-lucide="corner-down-right"></i> Your Public Reply</label>
            <textarea id="reply-text" class="reply-textarea" rows="5" maxlength="4000" required placeholder="Type your response here. This will be visible to everyone on the product page..."></textarea>
            <div style="display: flex; justify-content: flex-end; margin-top: 1rem;">
              <button type="submit" class="btn btn-primary"><i data-lucide="send"></i> ${r.reply ? 'Update Reply' : 'Post Reply'}</button>
            </div>
          </form>
        </div>`;
      document.getElementById('reply-text').value = r.reply || '';
      lucide.createIcons();

      document.getElementById('reply-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        btn.disabled = true;
        try {
          await api(`/api/reviews/${reviewId}/reply`, { method: 'PUT', body: { reply: document.getElementById('reply-text').value } });
          toast('Reply posted publicly.');
          setTimeout(() => { window.location.href = 'seller-reviews.html'; }, 900);
        } catch (err) {
          toast(err.message, 'warning');
          btn.disabled = false;
        }
      });
    }

    ready.then((me) => {
      if (!me) return;
      if (!reviewId) {
        document.getElementById('reply-root').innerHTML = '<div class="panel-body"><p class="empty-note">No review selected. <a href="seller-reviews.html">Back to reviews</a></p></div>';
        return;
      }
      load();
    });
  </script>
  <script src="../motion.js"></script>
</body>
</html>
