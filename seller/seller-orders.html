<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders | Seller Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../index.css">
  <style>
    /* Inline styles */
    :root { --sidebar-width: 260px; --header-height: 70px; }
    body { background-color: #F8FAFC; display: flex; min-height: 100vh; }
    .dashboard-sidebar { width: var(--sidebar-width); background-color: #FFFFFF; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; }
    .sidebar-header { height: var(--header-height); display: flex; align-items: center; padding: 0 1.5rem; border-bottom: 1px solid var(--border-color); }
    .sidebar-header .logo-wrapper { font-size: 1.25rem; }
    .sidebar-nav { padding: 1.5rem 1rem; flex: 1; }
    .nav-item { display: flex; align-items: center; gap: 1rem; padding: 0.85rem 1rem; color: var(--text-secondary); border-radius: var(--radius-small); font-weight: 500; margin-bottom: 0.5rem; transition: var(--transition-smooth); }
    .nav-item:hover, .nav-item.active { background-color: var(--accent-blue); color: var(--primary-color); }
    .sidebar-footer { padding: 1.5rem 1rem; border-top: 1px solid var(--border-color); }
    .dashboard-main { flex: 1; margin-left: var(--sidebar-width); display: flex; flex-direction: column; }
    .dashboard-header { height: var(--header-height); background-color: #FFFFFF; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; position: sticky; top: 0; z-index: 50; }
    .header-search { display: flex; align-items: center; background: var(--bg-grad-end); padding: 0.5rem 1rem; border-radius: var(--radius-large); width: 300px; }
    .header-search input { margin-left: 0.5rem; width: 100%; font-size: 0.9rem; }
    .header-actions { display: flex; align-items: center; gap: 1.5rem; }
    .user-profile { display: flex; align-items: center; gap: 0.75rem; }
    .user-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .user-info h6 { font-size: 0.9rem; font-weight: 600; color: var(--text-primary); }
    .user-info p { font-size: 0.75rem; color: var(--text-secondary); }
    .dashboard-content { padding: 2rem; }
    .dashboard-panel { background: #FFFFFF; border: 1px solid var(--border-color); border-radius: var(--radius-medium); box-shadow: var(--shadow-light); }
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th { text-align: left; padding: 1rem; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); border-bottom: 1px solid var(--border-color); background: #F8FAFC; }
    .data-table td { padding: 1rem; font-size: 0.9rem; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
    .status-badge { display: inline-flex; padding: 0.25rem 0.75rem; border-radius: 50px; font-size: 0.75rem; font-weight: 600; }
    .status-badge.completed { background: #D1FAE5; color: #10B981; }
    .status-badge.pending { background: var(--accent-yellow); color: #F59E0B; }
    .status-badge.shipped { background: var(--accent-blue); color: var(--primary-color); }
  </style>
  <!-- Brand skin (loaded last so it wins over page-level legacy styles) -->
  <link rel="stylesheet" href="../skin.css">
</head>
<body>
  <aside class="dashboard-sidebar">
    <div class="sidebar-header">
      <a href="../index.html" class="logo-wrapper">
        
        <span class="logo-text">YouVersion <span class="accent-number">2</span></span>
      </a>
    </div>
    <div class="sidebar-nav">
      <a href="seller-dashboard.html" class="nav-item">
        <i data-lucide="layout-dashboard"></i><span>Dashboard</span>
      </a>
      <a href="seller-books.html" class="nav-item">
        <i data-lucide="book"></i><span>My Books</span>
      </a>
      <a href="seller-orders.html" class="nav-item active">
        <i data-lucide="shopping-cart"></i><span>Orders</span>
      </a>
      <a href="seller-messages.html" class="nav-item">
        <i data-lucide="message-square"></i><span>Messages</span>
      </a>
      <a href="seller-notifications.html" class="nav-item">
        <i data-lucide="bell"></i><span>Notifications</span>
      </a>
    </div>
    <div class="sidebar-footer">
      <a href="seller-settings.html" class="nav-item">
        <i data-lucide="settings"></i><span>Settings</span>
      </a>
      <a href="../login.html" class="nav-item">
        <i data-lucide="log-out"></i><span>Logout</span>
      </a>
    </div>
  </aside>

  <main class="dashboard-main">
    <header class="dashboard-header">
      <div class="header-search">
        <i data-lucide="search" style="color: var(--text-light); width: 18px;"></i>
        <input type="text" placeholder="Search orders...">
      </div>
      <div class="header-actions">
        <a href="seller-notifications.html" class="action-btn" title="Notifications">
          <i data-lucide="bell"></i><span class="badge" style="top: 0; right: 0;">3</span>
        </a>
        <div class="user-profile">
          <img src="../assets/2.jpg" alt="Ollie Baldemor" class="user-avatar">
          <div class="user-info">
            <h6>Ollie G. Baldemor</h6>
            <p>Author & Seller</p>
          </div>
          <i data-lucide="chevron-down" style="color: var(--text-secondary); width: 16px;"></i>
        </div>
      </div>
    </header>

    <div class="dashboard-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; gap: 1rem; flex-wrap: wrap;">
        <div>
          <h1 style="font-size: 1.75rem; font-weight: 700;">Orders</h1>
          <p style="color: var(--text-secondary); font-size: 0.9rem;">View and manage your customer orders.</p>
        </div>
        <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
          <select id="filter-status" class="filter-select" aria-label="Filter by status">
            <option value="">All Statuses</option>
            <option>Pending</option>
            <option>Processing</option>
            <option>Shipped</option>
            <option>Delivered</option>
            <option>Cancelled</option>
          </select>
          <select id="filter-month" class="filter-select" aria-label="Filter by month">
            <option value="">All Months</option>
          </select>
          <button class="btn btn-outline" onclick="exportOrdersCSV()"><i data-lucide="download"></i> Export</button>
        </div>
      </div>

      <div class="dashboard-panel">
        <div style="padding: 0; overflow-x: auto;">
          <table class="data-table">
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Products</th>
                <th>Total</th>
                <th>Date</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="orders-body">
              <tr><td colspan="7" class="empty-cell">Loading orders…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../auth.js"></script>
  <script src="seller-common.js"></script>
  <script>
    lucide.createIcons();
    const { api, esc, money, fmtDate, statusBadge, emptyRow, toast, ready } = YV;
    let orders = [];

    const monthKey = (iso) => iso ? iso.slice(0, 7) : '';

    function render() {
      const status = document.getElementById('filter-status').value;
      const month = document.getElementById('filter-month').value;
      const rows = orders.filter(o => (!status || o.status === status) && (!month || monthKey(o.created_at) === month));
      document.getElementById('orders-body').innerHTML = rows.length ? rows.map(o => `
        <tr>
          <td><a href="seller-order-details.html?id=${o.id}"><strong>#${esc(o.reference)}</strong></a></td>
          <td>${esc(o.customer_name)}<br><span class="cell-sub">${esc(o.ship_city || '')}</span></td>
          <td>${o.items.map(i => `${i.quantity}x ${esc(i.title)}`).join('<br>')}</td>
          <td>${money(o.total_amount)}</td>
          <td>${fmtDate(o.created_at)}</td>
          <td>${statusBadge(o.status)}</td>
          <td>${['Pending', 'Processing'].includes(o.status)
            ? `<a href="seller-fulfill-order.html?id=${o.id}" class="btn btn-primary btn-small">Fulfill</a>`
            : `<a href="seller-order-details.html?id=${o.id}" class="btn btn-outline btn-small">Details</a>`}</td>
        </tr>`).join('') : emptyRow(7, orders.length ? 'No orders match these filters.' : 'No orders yet.');
    }

    function exportOrdersCSV() {
      const status = document.getElementById('filter-status').value;
      const month = document.getElementById('filter-month').value;
      const rows = orders.filter(o => (!status || o.status === status) && (!month || monthKey(o.created_at) === month));
      const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
      let csvContent = "Order ID,Customer,Email,City,Products,Total,Date,Status\n";
      rows.forEach(o => {
        csvContent += [o.reference, o.customer_name, o.customer_email, o.ship_city,
          o.items.map(i => `${i.quantity}x ${i.title}`).join('; '), o.total_amount.toFixed(2),
          fmtDate(o.created_at), o.status].map(q).join(',') + "\n";
      });
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", "YV2_Orders_Export.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    ready.then(async (me) => {
      if (!me) return;
      try {
        orders = await api('/api/orders');
      } catch (err) {
        document.getElementById('orders-body').innerHTML = emptyRow(7, err.message);
        return;
      }
      const months = [...new Set(orders.map(o => monthKey(o.created_at)))].filter(Boolean);
      document.getElementById('filter-month').insertAdjacentHTML('beforeend', months.map(m =>
        `<option value="${m}">${new Date(`${m}-01T00:00:00`).toLocaleDateString(undefined, { month: 'long', year: 'numeric' })}</option>`).join(''));
      const preset = YV.param('status');
      if (preset) document.getElementById('filter-status').value = preset;
      render();
      document.getElementById('filter-status').addEventListener('change', render);
      document.getElementById('filter-month').addEventListener('change', render);
    });
  </script>
  <script src="../motion.js"></script>
</body>
</html>
