<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fulfill Order | Seller Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../index.css">
  <style>
    :root { --sidebar-width: 260px; --header-height: 70px; }
    body { background-color: #F8FAFC; display: flex; min-height: 100vh; }
    .dashboard-sidebar { width: var(--sidebar-width); background-color: #FFFFFF; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; }
    .sidebar-header { height: var(--header-height); display: flex; align-items: center; padding: 0 1.5rem; border-bottom: 1px solid var(--border-color); }
    .sidebar-header .logo-wrapper { font-size: 1.25rem; }
    .sidebar-nav { padding: 1.5rem 1rem; flex: 1; }
    .nav-item { display: flex; align-items: center; gap: 1rem; padding: 0.85rem 1rem; color: var(--text-secondary); border-radius: var(--radius-small); font-weight: 500; margin-bottom: 0.5rem; transition: var(--transition-smooth); }
    .nav-item:hover, .nav-item.active { background-color: var(--accent-blue); color: var(--primary-color); }
    .sidebar-footer { padding: 1.5rem 1rem; border-top: 1px solid var(--border-color); }
    .dashboard-main { flex: 1; margin-left: var(--sidebar-width); display: flex; flex-direction: column; }
    .dashboard-header { height: var(--header-height); background-color: #FFFFFF; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; position: sticky; top: 0; z-index: 50; }
    .header-search { display: flex; align-items: center; background: var(--bg-grad-end); padding: 0.5rem 1rem; border-radius: var(--radius-large); width: 300px; }
    .header-search input { margin-left: 0.5rem; width: 100%; font-size: 0.9rem; }
    .header-actions { display: flex; align-items: center; gap: 1.5rem; }
    .user-profile { display: flex; align-items: center; gap: 0.75rem; }
    .user-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .user-info h6 { font-size: 0.9rem; font-weight: 600; color: var(--text-primary); }
    .user-info p { font-size: 0.75rem; color: var(--text-secondary); }
    .dashboard-content { padding: 2rem; max-width: 1000px; margin: 0 auto; width: 100%; }
    
    .dashboard-panel { background: #FFFFFF; border: 1px solid var(--border-color); border-radius: var(--radius-medium); box-shadow: var(--shadow-light); margin-bottom: 1.5rem; }
    .panel-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .panel-header h3 { font-size: 1.1rem; font-weight: 600; }
    .panel-body { padding: 1.5rem; }
    
    .grid-2 { display: grid; grid-template-columns: 3fr 2fr; gap: 1.5rem; }
    
    .info-group { margin-bottom: 1rem; }
    .info-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.25rem; }
    .info-group p { font-size: 0.95rem; color: var(--text-primary); font-weight: 500; }
    
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th { text-align: left; padding: 1rem; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); border-bottom: 1px solid var(--border-color); background: #F8FAFC; }
    .data-table td { padding: 1rem; font-size: 0.9rem; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
    
    /* Form Styles */
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.5rem; }
    .form-group input, .form-group select { width: 100%; padding: 0.75rem 1rem; border: 1.5px solid var(--border-color); border-radius: var(--radius-small); font-size: 0.95rem; font-family: inherit; transition: var(--transition-smooth); outline: none; }
    .form-group input:focus, .form-group select:focus { border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(21,101,192,0.1); }
  </style>
  <!-- Brand skin (loaded last so it wins over page-level legacy styles) -->
  <link rel="stylesheet" href="../skin.css">
</head>
<body>
  <aside class="dashboard-sidebar">
    <div class="sidebar-header">
      <a href="../index.html" class="logo-wrapper">
        
        <span class="logo-text">YouVersion <span class="accent-number">2</span></span>
      </a>
    </div>
    <div class="sidebar-nav">
      <a href="seller-dashboard.html" class="nav-item">
        <i data-lucide="layout-dashboard"></i><span>Dashboard</span>
      </a>
      <a href="seller-books.html" class="nav-item">
        <i data-lucide="book"></i><span>My Books</span>
      </a>
      <a href="seller-orders.html" class="nav-item active">
        <i data-lucide="shopping-cart"></i><span>Orders</span>
      </a>
      <a href="seller-messages.html" class="nav-item">
        <i data-lucide="message-square"></i><span>Messages</span>
      </a>
      <a href="seller-notifications.html" class="nav-item">
        <i data-lucide="bell"></i><span>Notifications</span>
      </a>
    </div>
    <div class="sidebar-footer">
      <a href="seller-settings.html" class="nav-item">
        <i data-lucide="settings"></i><span>Settings</span>
      </a>
      <a href="../login.html" class="nav-item">
        <i data-lucide="log-out"></i><span>Logout</span>
      </a>
    </div>
  </aside>

  <main class="dashboard-main">
    <header class="dashboard-header">
      <div class="header-search">
        <i data-lucide="search" style="color: var(--text-light); width: 18px;"></i>
        <input type="text" placeholder="Search...">
      </div>
      <div class="header-actions">
        <a href="seller-notifications.html" class="action-btn" title="Notifications">
          <i data-lucide="bell"></i><span class="badge" style="top: 0; right: 0;">3</span>
        </a>
        <div class="user-profile">
          <img src="../assets/2.jpg" alt="Ollie Baldemor" class="user-avatar">
          <div class="user-info">
            <h6>Ollie G. Baldemor</h6>
            <p>Author & Seller</p>
          </div>
          <i data-lucide="chevron-down" style="color: var(--text-secondary); width: 16px;"></i>
        </div>
      </div>
    </header>

    <div class="dashboard-content" id="fulfill-root">
      <p class="empty-note">Loading order…</p>
    </div>
  </main>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../auth.js"></script>
  <script src="seller-common.js"></script>
  <script>
    lucide.createIcons();
    const { api, esc, statusBadge, toast, param, ready } = YV;
    const orderId = param('id');

    async function load() {
      const root = document.getElementById('fulfill-root');
      let o;
      try {
        o = await api(`/api/orders/${orderId}`);
      } catch (err) {
        root.innerHTML = `<p class="empty-note">${esc(err.message)} <a href="seller-orders.html">Back to orders</a></p>`;
        return;
      }
      const canShip = ['Pending', 'Processing'].includes(o.status);
      root.innerHTML = `
        <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem;">
          <a href="seller-order-details.html?id=${o.id}" class="btn btn-outline btn-small icon-only-btn" style="border-radius: 50%;" aria-label="Back to order"><i data-lucide="arrow-left"></i></a>
          <div>
            <h1 style="font-size: 1.75rem; font-weight: 700; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
              Fulfill Order #${esc(o.reference)} ${statusBadge(o.status)}
            </h1>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">${canShip ? 'Please pack the items and prepare them for shipping.' : `This order is already ${esc(o.status.toLowerCase())}.`}</p>
          </div>
        </div>

        <div class="grid-2">
          <div style="display: flex; flex-direction: column; gap: 1.5rem;">
            <div class="dashboard-panel">
              <div class="panel-header"><h3>Items to Pack</h3></div>
              <div class="panel-body" style="padding: 0;">
                <table class="data-table">
                  <thead><tr><th>Item</th><th>Qty</th></tr></thead>
                  <tbody>
                    ${o.items.map(i => `
                      <tr>
                        <td><div style="display: flex; align-items: center; gap: 1rem;">
                          <img src="${esc(i.cover_image)}" alt="" class="book-thumb">
                          <div><strong>${esc(i.title)}</strong><br><span class="cell-sub">${esc(i.author)}</span></div>
                        </div></td>
                        <td><strong style="font-size: 1.1rem;">${i.quantity}</strong></td>
                      </tr>`).join('')}
                  </tbody>
                </table>
              </div>
            </div>

            <div class="dashboard-panel">
              <div class="panel-header"><h3>Delivery Information</h3></div>
              <div class="panel-body">
                <div class="info-group"><label>Customer Details</label>
                  <p>${esc(o.customer_name)}<br>${esc(o.customer_email || '')}</p></div>
                <div class="info-group" style="margin-bottom: 0; margin-top: 1.5rem;"><label>Shipping Address</label>
                  <p style="line-height: 1.5;">${esc(o.ship_address || '')}<br>${esc(o.ship_city || '')} ${esc(o.ship_zip || '')}<br>Philippines</p></div>
              </div>
            </div>
          </div>

          <div class="dashboard-panel" style="align-self: flex-start;">
            <div class="panel-header"><h3>Process Shipment</h3></div>
            <div class="panel-body">
              ${canShip ? `
              <form id="ship-form">
                <div class="form-group">
                  <label for="courier">Select Courier</label>
                  <select id="courier" required>
                    <option value="">-- Choose Courier --</option>
                    <option>J&amp;T Express</option>
                    <option>LBC Express</option>
                    <option>Ninja Van</option>
                    <option>Grab Express (Same Day)</option>
                    <option>Other / Personal Delivery</option>
                  </select>
                </div>
                <div class="form-group">
                  <label for="tracking">Tracking Number</label>
                  <input type="text" id="tracking" placeholder="e.g. JT1234567890" required maxlength="100">
                  <span style="font-size: 0.75rem; color: var(--text-light); margin-top: 0.25rem; display: block;">You must provide a valid tracking ID for the customer.</span>
                </div>
                <div class="form-group" style="display: flex; gap: 0.5rem; align-items: center; margin-top: 2rem;">
                  <input type="checkbox" id="notifyCustomer" checked style="width: auto; margin: 0; accent-color: var(--primary-color);">
                  <label for="notifyCustomer" style="margin: 0; font-weight: 500;">Email tracking details to customer</label>
                </div>
                <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 2rem 0 1.5rem 0;">
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;"><i data-lucide="package-check"></i> Mark as Shipped</button>
                <p style="text-align: center; font-size: 0.75rem; color: var(--text-light); margin-top: 1rem;">This action will update the order status and notify the buyer.</p>
              </form>` : `<p class="empty-note">Nothing to ship. <a href="seller-order-details.html?id=${o.id}">View order details</a></p>`}
            </div>
          </div>
        </div>`;
      lucide.createIcons();

      document.getElementById('ship-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        btn.disabled = true;
        try {
          await api(`/api/orders/${o.id}/status`, {
            method: 'PUT',
            body: {
              status: 'Shipped',
              courier: document.getElementById('courier').value,
              tracking_number: document.getElementById('tracking').value,
              notify_customer: document.getElementById('notifyCustomer').checked,
            }
          });
          toast('Order marked as shipped!');
          setTimeout(() => { window.location.href = `seller-order-details.html?id=${o.id}`; }, 900);
        } catch (err) {
          toast(err.message, 'warning');
          btn.disabled = false;
        }
      });
    }

    ready.then((me) => {
      if (!me) return;
      if (!orderId) {
        document.getElementById('fulfill-root').innerHTML = '<p class="empty-note">No order selected. <a href="seller-orders.html">Back to orders</a></p>';
        return;
      }
      load();
    });
  </script>
  <script src="../motion.js"></script>
</body>
</html>
