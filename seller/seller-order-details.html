<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Details | Seller Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../index.css">
  <style>
    :root { --sidebar-width: 260px; --header-height: 70px; }
    body { background-color: #F8FAFC; display: flex; min-height: 100vh; }
    .dashboard-sidebar { width: var(--sidebar-width); background-color: #FFFFFF; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; }
    .sidebar-header { height: var(--header-height); display: flex; align-items: center; padding: 0 1.5rem; border-bottom: 1px solid var(--border-color); }
    .sidebar-header .logo-wrapper { font-size: 1.25rem; }
    .sidebar-nav { padding: 1.5rem 1rem; flex: 1; }
    .nav-item { display: flex; align-items: center; gap: 1rem; padding: 0.85rem 1rem; color: var(--text-secondary); border-radius: var(--radius-small); font-weight: 500; margin-bottom: 0.5rem; transition: var(--transition-smooth); }
    .nav-item:hover, .nav-item.active { background-color: var(--accent-blue); color: var(--primary-color); }
    .sidebar-footer { padding: 1.5rem 1rem; border-top: 1px solid var(--border-color); }
    .dashboard-main { flex: 1; margin-left: var(--sidebar-width); display: flex; flex-direction: column; }
    .dashboard-header { height: var(--header-height); background-color: #FFFFFF; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; position: sticky; top: 0; z-index: 50; }
    .header-search { display: flex; align-items: center; background: var(--bg-grad-end); padding: 0.5rem 1rem; border-radius: var(--radius-large); width: 300px; }
    .header-search input { margin-left: 0.5rem; width: 100%; font-size: 0.9rem; }
    .header-actions { display: flex; align-items: center; gap: 1.5rem; }
    .user-profile { display: flex; align-items: center; gap: 0.75rem; }
    .user-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .user-info h6 { font-size: 0.9rem; font-weight: 600; color: var(--text-primary); }
    .user-info p { font-size: 0.75rem; color: var(--text-secondary); }
    .dashboard-content { padding: 2rem; max-width: 1000px; margin: 0 auto; width: 100%; }
    
    .dashboard-panel { background: #FFFFFF; border: 1px solid var(--border-color); border-radius: var(--radius-medium); box-shadow: var(--shadow-light); margin-bottom: 1.5rem; }
    .panel-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .panel-header h3 { font-size: 1.1rem; font-weight: 600; }
    .panel-body { padding: 1.5rem; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    
    .info-group { margin-bottom: 1rem; }
    .info-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.25rem; }
    .info-group p { font-size: 0.95rem; color: var(--text-primary); font-weight: 500; }
    
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th { text-align: left; padding: 1rem; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); border-bottom: 1px solid var(--border-color); background: #F8FAFC; }
    .data-table td { padding: 1rem; font-size: 0.9rem; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
    
    .summary-row { display: flex; justify-content: space-between; padding: 0.5rem 0; font-size: 0.95rem; }
    .summary-row.total { font-weight: 700; font-size: 1.1rem; border-top: 1px solid var(--border-color); padding-top: 1rem; margin-top: 0.5rem; }
  </style>
  <!-- Brand skin (loaded last so it wins over page-level legacy styles) -->
  <link rel="stylesheet" href="../skin.css">
</head>
<body>
  <aside class="dashboard-sidebar">
    <div class="sidebar-header">
      <a href="../index.html" class="logo-wrapper">
        
        <span class="logo-text">YouVersion <span class="accent-number">2</span></span>
      </a>
    </div>
    <div class="sidebar-nav">
      <a href="seller-dashboard.html" class="nav-item">
        <i data-lucide="layout-dashboard"></i><span>Dashboard</span>
      </a>
      <a href="seller-books.html" class="nav-item">
        <i data-lucide="book"></i><span>My Books</span>
      </a>
      <a href="seller-orders.html" class="nav-item active">
        <i data-lucide="shopping-cart"></i><span>Orders</span>
      </a>
      <a href="seller-messages.html" class="nav-item">
        <i data-lucide="message-square"></i><span>Messages</span>
      </a>
      <a href="seller-notifications.html" class="nav-item">
        <i data-lucide="bell"></i><span>Notifications</span>
      </a>
    </div>
    <div class="sidebar-footer">
      <a href="seller-settings.html" class="nav-item">
        <i data-lucide="settings"></i><span>Settings</span>
      </a>
      <a href="../login.html" class="nav-item">
        <i data-lucide="log-out"></i><span>Logout</span>
      </a>
    </div>
  </aside>

  <main class="dashboard-main">
    <header class="dashboard-header">
      <div class="header-search">
        <i data-lucide="search" style="color: var(--text-light); width: 18px;"></i>
        <input type="text" placeholder="Search...">
      </div>
      <div class="header-actions">
        <a href="seller-notifications.html" class="action-btn" title="Notifications">
          <i data-lucide="bell"></i><span class="badge" style="top: 0; right: 0;">3</span>
        </a>
        <div class="user-profile">
          <img src="../assets/2.jpg" alt="Ollie Baldemor" class="user-avatar">
          <div class="user-info">
            <h6>Ollie G. Baldemor</h6>
            <p>Author & Seller</p>
          </div>
          <i data-lucide="chevron-down" style="color: var(--text-secondary); width: 16px;"></i>
        </div>
      </div>
    </header>

    <div class="dashboard-content" id="order-root">
      <p class="empty-note">Loading order…</p>
    </div>
  </main>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../auth.js"></script>
  <script src="seller-common.js"></script>
  <script>
    lucide.createIcons();
    const { api, esc, money, fmtDate, statusBadge, toast, param, ready } = YV;
    const orderId = param('id');

    function step(label, icon, done, when) {
      return `
        <div class="progress-step ${done ? 'done' : ''}">
          <div class="progress-dot"><i data-lucide="${icon}"></i></div>
          <h6>${label}</h6>
          <span>${when || '&nbsp;'}</span>
        </div>`;
    }

    function actions(o) {
      const btns = [`<a href="seller-invoice.html?id=${o.id}" target="_blank" class="btn btn-outline"><i data-lucide="printer"></i> Print Invoice</a>`];
      if (o.status === 'Pending') btns.push(`<button class="btn btn-outline" onclick="setStatus('Processing')"><i data-lucide="loader"></i> Mark Processing</button>`);
      if (['Pending', 'Processing'].includes(o.status)) {
        btns.push(`<a href="seller-fulfill-order.html?id=${o.id}" class="btn btn-primary"><i data-lucide="truck"></i> Fulfill & Ship</a>`);
        btns.push(`<button class="btn btn-outline btn-danger-outline" onclick="setStatus('Cancelled')">Cancel Order</button>`);
      }
      if (o.status === 'Shipped') btns.push(`<button class="btn btn-primary" onclick="setStatus('Delivered')"><i data-lucide="home"></i> Mark Delivered</button>`);
      return btns.join('');
    }

    async function setStatus(status) {
      if (status === 'Cancelled' && !confirm('Cancel this order? Stock will be returned to inventory.')) return;
      try {
        const res = await api(`/api/orders/${orderId}/status`, { method: 'PUT', body: { status } });
        toast(res.message);
        load();
      } catch (err) {
        toast(err.message, 'warning');
      }
    }

    async function load() {
      const root = document.getElementById('order-root');
      let o;
      try {
        o = await api(`/api/orders/${orderId}`);
      } catch (err) {
        root.innerHTML = `<p class="empty-note">${esc(err.message)} <a href="seller-orders.html">Back to orders</a></p>`;
        return;
      }
      const order = ['Pending', 'Processing', 'Shipped', 'Delivered'];
      const reached = o.status === 'Cancelled' ? -1 : order.indexOf(o.status);
      const progressWidth = reached <= 0 ? 0 : (reached / 3) * 100;
      const expected = new Date(new Date(o.created_at).getTime() + 2 * 86400000);

      root.innerHTML = `
        <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap;">
          <a href="seller-orders.html" class="btn btn-outline btn-small icon-only-btn" style="border-radius: 50%;" aria-label="Back to orders"><i data-lucide="arrow-left"></i></a>
          <div>
            <h1 style="font-size: 1.75rem; font-weight: 700; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
              Order #${esc(o.reference)} ${statusBadge(o.status)}
            </h1>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">Placed on ${fmtDate(o.created_at, true)}</p>
          </div>
          <div style="margin-left: auto; display: flex; gap: 0.75rem; flex-wrap: wrap;">${actions(o)}</div>
        </div>

        <div class="dashboard-panel" style="margin-bottom: 1.5rem;">
          <div class="panel-header"><h3>Shipping Progress</h3></div>
          <div class="panel-body">
            ${o.status === 'Cancelled'
              ? `<p class="empty-note">This order was cancelled on ${fmtDate(o.cancelled_at, true)}. Stock was returned to inventory.</p>`
              : `<div class="progress-track" style="--progress-scale: ${progressWidth / 100};">
                  ${step('Order Placed', 'check', true, fmtDate(o.created_at, true))}
                  ${step('Processing', 'loader', reached >= 1, o.processing_at ? fmtDate(o.processing_at, true) : '')}
                  ${step('Shipped', 'truck', reached >= 2, o.shipped_at ? fmtDate(o.shipped_at, true) : '')}
                  ${step('Delivered', 'home', reached >= 3, o.delivered_at ? fmtDate(o.delivered_at, true) : `Expected ${fmtDate(expected)}`)}
                </div>`}
          </div>
        </div>

        <div class="grid-2">
          <div class="dashboard-panel">
            <div class="panel-header"><h3>Customer Information</h3></div>
            <div class="panel-body">
              <div class="info-group"><label>Name</label><p>${esc(o.customer_name)}</p></div>
              <div class="info-group"><label>Email</label><p>${esc(o.customer_email || '—')}</p></div>
              <div class="info-group" style="margin-bottom: 0;"><label>Account</label><p>${o.buyer_id ? 'Registered buyer' : 'Guest checkout'}</p></div>
            </div>
          </div>
          <div class="dashboard-panel">
            <div class="panel-header"><h3>Shipping Details</h3></div>
            <div class="panel-body">
              <div class="info-group"><label>Courier</label><p>${o.courier ? `${esc(o.courier)} (Tracking: ${esc(o.tracking_number)})` : 'Not shipped yet'}</p></div>
              <div class="info-group"><label>Payment</label><p>${o.payment_method === 'ewallet' ? 'E-Wallet (GCash / Maya) on delivery' : 'Cash on Delivery'}</p></div>
              <div class="info-group" style="margin-bottom: 0;"><label>Shipping Address</label>
                <p style="line-height: 1.5;">${esc(o.ship_address || '')}<br>${esc(o.ship_city || '')} ${esc(o.ship_zip || '')}<br>Philippines</p></div>
            </div>
          </div>
        </div>

        <div class="dashboard-panel">
          <div class="panel-header"><h3>Order Items</h3></div>
          <div class="panel-body" style="padding: 0; overflow-x: auto;">
            <table class="data-table">
              <thead><tr><th>Item</th><th>Price</th><th>Qty</th><th style="text-align: right;">Total</th></tr></thead>
              <tbody>
                ${o.items.map(i => `
                  <tr>
                    <td><div style="display: flex; align-items: center; gap: 1rem;">
                      <img src="${esc(i.cover_image)}" alt="" class="book-thumb">
                      <div><strong>${esc(i.title)}</strong><br><span class="cell-sub">${esc(i.author)}</span></div>
                    </div></td>
                    <td>${money(i.price)}</td>
                    <td>${i.quantity}</td>
                    <td style="text-align: right;">${money(i.line_total)}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
          <div class="panel-body order-summary">
            <div>
              <div class="summary-row"><span>Subtotal</span><span>${money(o.subtotal)}</span></div>
              <div class="summary-row"><span>Shipping Fee</span><span>${o.shipping_fee ? money(o.shipping_fee) : 'FREE'}</span></div>
              <div class="summary-row"><span>Discount${o.promo_code ? ` (${esc(o.promo_code)})` : ''}</span><span>-${money(o.discount)}</span></div>
              <div class="summary-row total"><span>Total</span><span style="color: var(--primary-color);">${money(o.total_amount)}</span></div>
            </div>
          </div>
        </div>`;
      lucide.createIcons();
    }

    ready.then((me) => {
      if (!me) return;
      if (!orderId) {
        document.getElementById('order-root').innerHTML = '<p class="empty-note">No order selected. <a href="seller-orders.html">Back to orders</a></p>';
        return;
      }
      load();
    });
  </script>
  <script src="../motion.js"></script>
</body>
</html>
