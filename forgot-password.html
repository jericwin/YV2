<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | YouVersion 2</title>
  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="index.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: var(--bg-grad-start);
      background-image: url('assets/3.png');
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .auth-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(21, 101, 192, 0.6), rgba(13, 71, 161, 0.7));
      z-index: 1;
    }

    .auth-card {
      background: #FFFFFF;
      width: 100%;
      max-width: 450px;
      border-radius: var(--radius-large);
      padding: 3rem 2.5rem;
      box-shadow: var(--shadow-premium);
      position: relative;
      z-index: 2;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-header .logo-wrapper {
      justify-content: center;
      margin-bottom: 1rem;
    }

    .auth-header h2 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .auth-header p {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }

    .auth-form .input-group {
      margin-bottom: 1.5rem;
    }

    .auth-form label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    .auth-form input {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-small);
      font-size: 0.95rem;
      transition: var(--transition-smooth);
    }

    .auth-form input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(21, 101, 192, 0.1);
    }

    .auth-form .btn {
      width: 100%;
    }

    .auth-footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .auth-footer a {
      color: var(--primary-color);
      font-weight: 600;
    }

    /* Steps */
    #step-2, #step-3 {
      display: none;
    }

    .back-link {
      display: inline-block;
      margin-top: 1rem;
      color: var(--text-secondary);
      font-size: 0.85rem;
      text-decoration: none;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="auth-container">
    <div class="auth-overlay"></div>
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="logo-wrapper">
          <span class="logo-text">YouVersion <span class="accent-number">2</span></span>
        </a>
        <h2 id="form-title">Forgot Password</h2>
        <p id="form-desc">Enter your email to reset your password.</p>
      </div>

      <!-- STEP 1: Enter Email -->
      <form class="auth-form" id="step-1">
        <div class="input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="name@example.com">
        </div>
        <button type="submit" class="btn btn-primary btn-large">
          Send Reset Code
        </button>
        <div class="auth-footer">
          Remember your password? <a href="login.html">Log In</a>
        </div>
      </form>

      <!-- STEP 2: Verify OTP -->
      <form class="auth-form" id="step-2">
        <div class="input-group">
          <label for="otp-code">Verification Code</label>
          <input type="text" id="otp-code" required placeholder="6-digit code">
        </div>
        <button type="submit" class="btn btn-primary btn-large">
          Verify Code
        </button>
        <div style="text-align: center;">
          <a href="#" class="back-link" id="back-to-email">Change Email</a>
        </div>
      </form>

      <!-- STEP 3: Reset Password -->
      <form class="auth-form" id="step-3">
        <div class="input-group">
          <label for="new-password">New Password</label>
          <input type="password" id="new-password" required placeholder="Min. 8 characters" autocomplete="new-password">
        </div>
        <div class="input-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" required placeholder="Repeat new password" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-large">
          Reset Password
        </button>
      </form>

    </div>
  </div>

  <script>
    let currentEmail = '';
    let currentCode = '';

    const step1 = document.getElementById('step-1');
    const step2 = document.getElementById('step-2');
    const step3 = document.getElementById('step-3');
    const title = document.getElementById('form-title');
    const desc = document.getElementById('form-desc');

    // Step 1: Send OTP
    step1.addEventListener('submit', async (e) => {
      e.preventDefault();
      const emailInput = document.getElementById('email').value;
      
      const btn = step1.querySelector('button');
      btn.innerText = 'Sending...';
      btn.disabled = true;

      try {
        const response = await fetch('http://127.0.0.1:5000/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: emailInput })
        });
        const data = await response.json();

        if (response.ok) {
          currentEmail = emailInput;
          step1.style.display = 'none';
          step2.style.display = 'block';
          title.innerText = 'Verify Email';
          desc.innerText = `Enter the code sent to ${currentEmail}`;
        } else {
          alert('Error: ' + data.error);
        }
      } catch (err) {
        alert('Failed to connect to the server.');
      } finally {
        btn.innerText = 'Send Reset Code';
        btn.disabled = false;
      }
    });

    // Step 2: Verify OTP
    step2.addEventListener('submit', async (e) => {
      e.preventDefault();
      const codeInput = document.getElementById('otp-code').value;
      
      try {
        const response = await fetch('http://127.0.0.1:5000/verify-forgot-password-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: currentEmail, code: codeInput })
        });
        const data = await response.json();

        if (response.ok) {
          currentCode = codeInput;
          step2.style.display = 'none';
          step3.style.display = 'block';
          title.innerText = 'New Password';
          desc.innerText = 'Enter your new password below.';
        } else {
          alert('Error: ' + data.error);
        }
      } catch (err) {
        alert('Failed to connect to the server.');
      }
    });

    // Step 3: Reset Password
    step3.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (newPassword !== confirmPassword) {
        alert("Passwords do not match!");
        return;
      }
      if (newPassword.length < 8) {
        alert("Password must be at least 8 characters long.");
        return;
      }

      try {
        const response = await fetch('http://127.0.0.1:5000/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: currentEmail, code: currentCode, password: newPassword })
        });
        const data = await response.json();

        if (response.ok) {
          alert('Password reset successfully! You can now log in.');
          window.location.href = 'login.html';
        } else {
          alert('Error: ' + data.error);
        }
      } catch (err) {
        alert('Failed to connect to the server.');
      }
    });

    // Back to email
    document.getElementById('back-to-email').addEventListener('click', (e) => {
      e.preventDefault();
      step2.style.display = 'none';
      step1.style.display = 'block';
      title.innerText = 'Forgot Password';
      desc.innerText = 'Enter your email to reset your password.';
    });
  </script>
</body>
</html>
