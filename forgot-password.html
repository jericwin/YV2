<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | YouVersion 2</title>
  <meta name="theme-color" content="#0A1A3F">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <style>
    /* Steps */
    #step-2, #step-3 { display: none; }
    .back-link { display: inline-block; margin-top: 1.25rem; color: var(--text-secondary); font-size: 0.9rem; }
    .back-link:hover { color: var(--primary-color); }
  </style>
</head>

<body>
  <div class="auth-split">
    <aside class="auth-art" aria-label="YouVersion 2">
      <img src="assets/hero-wide.jpg" alt="" class="auth-art-img">
      <div class="auth-art-top">
        <a href="index.html" class="logo-wrapper">
          <span class="logo-text">YouVersion <span class="accent-number">2</span></span>
        </a>
        <a href="index.html" class="back-home"><i data-lucide="arrow-left"></i> Back to Home</a>
      </div>
      <div class="auth-art-quote" data-reveal>
        <h2>Every system needs a <span class="serif">reset</span> sometimes.</h2>
        <p>We’ll send a one-time code to your inbox so you can get back in.</p>
      </div>
      <div class="auth-art-foot">
        <span>Faith</span><span>Family</span><span>Fitness</span><span>Finances</span><span>Fellowship</span>
      </div>
    </aside>

    <main class="auth-panel">
      <div class="auth-card">
        <div class="auth-header">
          <span class="eyebrow" data-reveal>~$ password --reset</span>
          <h2 id="form-title">Forgot Password</h2>
          <p id="form-desc">Enter your email to reset your password.</p>
        </div>

        <!-- STEP 1: Enter Email -->
        <form class="auth-form" id="step-1">
          <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required placeholder="name@example.com" autocomplete="email">
          </div>
          <button type="submit" class="btn btn-primary btn-large">
            Send Reset Code
          </button>
          <div class="auth-footer">
            Remember your password? <a href="login.html">Log In</a>
          </div>
        </form>

        <!-- STEP 2: Verify OTP -->
        <form class="auth-form" id="step-2">
          <div class="input-group">
            <label for="otp-code">Verification Code</label>
            <input type="text" id="otp-code" required placeholder="6-digit code" inputmode="numeric" autocomplete="one-time-code">
          </div>
          <button type="submit" class="btn btn-primary btn-large">
            Verify Code
          </button>
          <div style="text-align: center;">
            <a href="#" class="back-link" id="back-to-email">Change Email</a>
          </div>
        </form>

        <!-- STEP 3: Reset Password -->
        <form class="auth-form" id="step-3">
          <div class="input-group">
            <label for="new-password">New Password</label>
            <input type="password" id="new-password" required placeholder="Min. 8 characters" autocomplete="new-password">
          </div>
          <div class="input-group">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" required placeholder="Repeat new password" autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary btn-large">
            Reset Password
          </button>
        </form>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>
  <script>
    let currentEmail = '';
    let currentCode = '';

    const step1 = document.getElementById('step-1');
    const step2 = document.getElementById('step-2');
    const step3 = document.getElementById('step-3');
    const title = document.getElementById('form-title');
    const desc = document.getElementById('form-desc');

    // Step 1: Send OTP
    step1.addEventListener('submit', async (e) => {
      e.preventDefault();
      const emailInput = document.getElementById('email').value;
      
      const btn = step1.querySelector('button');
      btn.innerText = 'Sending...';
      btn.disabled = true;

      try {
        const response = await fetch('/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: emailInput })
        });
        const data = await response.json();

        if (response.ok) {
          currentEmail = emailInput;
          step1.style.display = 'none';
          step2.style.display = 'block';
          title.innerText = 'Verify Email';
          desc.innerText = `Enter the code sent to ${currentEmail}`;
        } else {
          alert('Error: ' + data.error);
        }
      } catch (err) {
        alert('Failed to connect to the server.');
      } finally {
        btn.innerText = 'Send Reset Code';
        btn.disabled = false;
      }
    });

    // Step 2: Verify OTP
    step2.addEventListener('submit', async (e) => {
      e.preventDefault();
      const codeInput = document.getElementById('otp-code').value;
      
      try {
        const response = await fetch('/verify-forgot-password-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: currentEmail, code: codeInput })
        });
        const data = await response.json();

        if (response.ok) {
          currentCode = codeInput;
          step2.style.display = 'none';
          step3.style.display = 'block';
          title.innerText = 'New Password';
          desc.innerText = 'Enter your new password below.';
        } else {
          alert('Error: ' + data.error);
        }
      } catch (err) {
        alert('Failed to connect to the server.');
      }
    });

    // Step 3: Reset Password
    step3.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (newPassword !== confirmPassword) {
        alert("Passwords do not match!");
        return;
      }
      if (newPassword.length < 8) {
        alert("Password must be at least 8 characters long.");
        return;
      }

      try {
        const response = await fetch('/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: currentEmail, code: currentCode, password: newPassword })
        });
        const data = await response.json();

        if (response.ok) {
          alert('Password reset successfully! You can now log in.');
          window.location.href = 'login.html';
        } else {
          alert('Error: ' + data.error);
        }
      } catch (err) {
        alert('Failed to connect to the server.');
      }
    });

    // Back to email
    document.getElementById('back-to-email').addEventListener('click', (e) => {
      e.preventDefault();
      step2.style.display = 'none';
      step1.style.display = 'block';
      title.innerText = 'Forgot Password';
      desc.innerText = 'Enter your email to reset your password.';
    });
  </script>
  <script src="motion.js"></script>
</body>
</html>
